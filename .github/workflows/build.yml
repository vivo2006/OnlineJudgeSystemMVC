name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore OnlineJudgeSystemMVC.sln
      - run: dotnet build OnlineJudgeSystemMVC.sln --no-restore --configuration Release
      - run: dotnet test TestingLayer/TestingLayer.csproj --no-build --configuration Release
